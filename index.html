<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shift - Sliding Logic Puzzle</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --text-muted: #64748b;
      --tile-bg: #334155;
      --tile-correct: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* Stats Dashboard */
    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: var(--surface);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    .stat-box {
      text-align: center;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text);
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Puzzle Board Layout */
    .board-wrapper {
      position: relative;
      background: var(--surface);
      padding: 12px;
      border-radius: 16px;
      aspect-ratio: 1 / 1;
      width: 100%;
      box-sizing: border-box;
    }

    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
    }

    .tile {
      background: var(--tile-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.empty {
      background: transparent;
      cursor: default;
    }

    .tile.correct-pos {
      background: var(--tile-correct);
    }

    /* UI Controls & Interactivity */
    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      background: var(--accent);
      color: var(--text);
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    
    .btn-secondary {
      background: #475569;
    }

    /* Win Overlay Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: var(--surface);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Shift Logic</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-box"><div class="stat-val" id="movesVal">0</div><div class="stat-lbl">Moves</div></div>
      <div class="stat-box"><div class="stat-val" id="streakVal">0</div><div class="stat-lbl">Streak</div></div>
      <div class="stat-box"><div class="stat-val" id="bestVal">--</div><div class="stat-lbl">Best</div></div>
    </div>

    <div class="board-wrapper">
      <div class="puzzle-grid" id="grid"></div>
    </div>

    <div class="controls">
      <button class="btn-secondary" onclick="resetGame()">Reset</button>
      <button onclick="shareScore()">Share Progress</button>
    </div>
  </div>

  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>🎉 Solved!</h2>
      <p id="winDetails">You solved it in 0 moves!</p>
      <button onclick="closeModal()">Play Again</button>
    </div>
  </div>
  <script>
    // App Logic Engine - Programmatic Array Generation Bypass
    const targetState = Array.from({length: 9}, (_, i) => (i + 1) % 9); 
    let currentState = [...targetState];
    let moves = 0;
    
    let appStats = JSON.parse(localStorage.getItem('slide_puzzle_stats')) || {
      streak: 0,
      bestScore: Infinity
    };

    function initGame() {
      shuffleBoard();
      moves = 0;
      updateDOM();
    }

    function shuffleBoard() {
      do {
        for (let i = currentState.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [currentState[i], currentState[j]] = [currentState[j], currentState[i]];
        }
      } while (!isSolvable(currentState) || isWinningState());
    }

    function isSolvable(arr) {
      let inversions = 0;
      const filtered = arr.filter(x => x !== 0);
      for (let i = 0; i < filtered.length; i++) {
        for (let j = i + 1; j < filtered.length; j++) {
          if (filtered[i] > filtered[j]) inversions++;
        }
      }
      return inversions % 2 === 0;
    }

    function handleTileClick(index) {
      const emptyIndex = currentState.indexOf(0);
      const validMoves = getValidMoves(emptyIndex);

      if (validMoves.includes(index)) {
        [currentState[emptyIndex], currentState[index]] = [currentState[index], currentState[emptyIndex]];
        moves++;
        updateDOM();
        checkWinCondition();
      }
    }

    function getValidMoves(emptyIndex) {
      const row = Math.floor(emptyIndex / 3);
      const col = emptyIndex % 3;
      const moves = [];

      if (row > 0) moves.push(emptyIndex - 3);
      if (row < 2) moves.push(emptyIndex + 3);
      if (col > 0) moves.push(emptyIndex - 1);
      if (col < 2) moves.push(emptyIndex + 1);

      return moves;
    }

    function checkWinCondition() {
      if (isWinningState()) {
        appStats.streak++;
        if (moves < appStats.bestScore) appStats.bestScore = moves;
        localStorage.setItem('slide_puzzle_stats', JSON.stringify(appStats));
        
        document.getElementById('winDetails').innerText = `Solved in ${moves} moves. Current win streak is ${appStats.streak}!`;
        document.getElementById('winModal').classList.add('active');
      }
    }

    function isWinningState() {
      return currentState.every((val, i) => val === targetState[i]);
    }

    function updateDOM() {
      document.getElementById('movesVal').innerText = moves;
      document.getElementById('streakVal').innerText = appStats.streak;
      document.getElementById('bestVal').innerText = appStats.bestScore === Infinity ? '--' : appStats.bestScore;

      const gridContainer = document.getElementById('grid');
      gridContainer.innerHTML = '';

      currentState.forEach((value, index) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        
        if (value === 0) {
          tile.classList.add('empty');
        } else {
          tile.innerText = value;
          if (value === targetState[index]) {
            tile.classList.add('correct-pos');
          }
          tile.onclick = () => handleTileClick(index);
        }
        gridContainer.appendChild(tile);
      });
    }

    function resetGame() {
      appStats.streak = 0;
      localStorage.setItem('slide_puzzle_stats', JSON.stringify(appStats));
      initGame();
    }

    function closeModal() {
      document.getElementById('winModal').classList.remove('active');
      initGame();
    }

    function shareScore() {
      const text = `🎮 Shift Logic Puzzle\n🔥 Streak: ${appStats.streak}\n⚡ Best Match: ${appStats.bestScore === Infinity ? '0' : appStats.bestScore} moves\nPlay instantly inside your browser!`;
      navigator.clipboard.writeText(text).then(() => {
        alert("App state metrics copied to system clipboard! Share it with friends.");
      });
    }

    initGame();
  </script>

</body>
</html>
